name: CI

on:
  push:
    branches: [main, final, backend, frontend]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Start PostgreSQL 16
        run: docker compose up -d --wait db

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Database migrations and SQL tests
        run: npm run db:test
